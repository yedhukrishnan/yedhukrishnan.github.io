{%- assign share_url = page.url | absolute_url | url_encode -%}
{%- assign share_title = page.title | url_encode | replace: '+', '%20' -%}
<section class="share">
  <p class="share-line">
    <span class="share-label">SHARE</span>
    <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ share_url }}" target="_blank" rel="noopener">[linkedin]</a>
    <a href="https://x.com/intent/post?url={{ share_url }}&amp;text={{ share_title }}{% if site.twitter.username %}&amp;via={{ site.twitter.username }}{% endif %}" target="_blank" rel="noopener">[x]</a>
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}" target="_blank" rel="noopener">[facebook]</a>
    <a href="mailto:?subject={{ share_title }}&amp;body={{ share_url }}">[email]</a>
  </p>
  {%- if site.author.email %}
  <p class="share-line">
    <span class="share-label">OR, WRITE TO ME:</span>
    <a href="mailto:{{ site.author.email }}?subject=Re:%20{{ share_title }}">{{ site.author.email }}</a>
  </p>
  {%- endif %}
</section>
