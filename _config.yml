# WakaTime panel on the About page: JSON links from wakatime.com/share/embed
# (Format: JSON), one per chart. Remove a line to hide that list.
# Names under `hide` are dropped from every list and the rest rescaled to 100%.
# Under `allow`, a list can name the only entries it shows; everything else is
# dropped and the rest rescaled to 100%. Names match case-insensitively.
wakatime:
  languages: https://wakatime.com/share/@ce00ae1b-92c6-4a26-ab09-b905af578f27/b4a9ba07-d7cf-465d-a596-c6451cbd55c9.json
  editors: https://wakatime.com/share/@ce00ae1b-92c6-4a26-ab09-b905af578f27/31b22d43-c0b6-4675-9f0a-484fc5110b14.json
  operating_systems: https://wakatime.com/share/@ce00ae1b-92c6-4a26-ab09-b905af578f27/9f6a8381-8334-4fcc-ba15-a545a62d4885.json
  hide:
    - Text
    - JSON
    - YAML
    - directory
  allow:
    editors:
      - Claude Code
      - Codex
      - Gemini CLI
      - Neovim
      - Vim
      - Jupyterlab
      - VS Code
      - Cursor
      - Zed
      - Terminal

# Analytics (GoatCounter) — set to your site code, e.g. "yedhu" for yedhu.goatcounter.com
goatcounter: yedhu

# Goodreads: "currently reading" on the home page and the Reading panel on About.
# user_id is the number in your profile URL: goodreads.com/user/show/<user_id>-name
goodreads:
  user_id: "37922611"

# Comments (giscus)
giscus:
  repo: yedhukrishnan/yedhukrishnan.github.io
  repo_id: R_kgDOIS5mvQ
  category: General
  category_id: DIC_kwDOIS5mvc4Cv6cZ

# Build
permalink: /posts/:title/
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true

sass:
  style: compressed

exclude:
  - _scripts
  - README.md
  - CLAUDE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
